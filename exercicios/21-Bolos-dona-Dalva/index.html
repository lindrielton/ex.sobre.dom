<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolos dona Dalva</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="stilos/style.css">

<body>
    
    <header id="header">
        <h1>Dona Dalva Bolos</h1> 
        <button id="button">Ativar Btn</button>

     <main id="main">
        <h2>Escolha o bolo na comfiguração que você quiser!</h2>
        <h3 id="aniver">Sabores Aniversario!</h3>
        <button>Chocolate</button>
        <button>Ninho</button>
        <button>Ninho trunfado</button>
        <button>Chocolate braco</button>
        <button>Morango com Chantilly</button>
        <button>brigadeiro</button> 
        <ul id="birthday"></ul>

        <h3 id="marrige">Sabores Casamento!</h3>

        <button>Nozes/Baba de Moça</button>
        <button>Doce de Leite</button>
        <button>Ninho com morango</button>
         <ul id="marriage"></ul>


        <h3 id="pudding">Tortas & pudins!</h3>

        <button>Torta Salgada</button>
        <button>pudin tradicional</button>
        <button>torta de banana</button>
        <button>torta de chocolate</button>
        <ul id="pudding"></ul>

        <h3 id="savory">Salgados!</h3>

        <button>Tortiletes</button>
        <button>pão de queijo</button>
        <button>pão de forma</button>
        <button>enrroladinhos</button>
        <button>esfirras</button>
        <button>pastel</button>
        <button>coxinha</button>
        <button>panqueca</button>

        <ul id="savory"></ul>
