<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic-tac-toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="logic.js" defer></script>
</head>
<body>
    <h1>Jogo da velha</h1>
    <hr>

    <label for="player1">x</label>
    <input type="text" id="player1" placeholder="nome  gamer 1">
     <label for="player1">O</label>
    <input type="text" id="player1" placeholder="nome  gamer 2">
    <button id="start">Começar</button>
    <h2>vez de : <span id="turnPlayer"></span></h2>

    <section id="gameBoard">
        <span class=".cursor-poiter" data-region="0.0"></span>
        <span class=".cursor-poiter" data-region="0.1"></span>
        <span class=".cursor-poiter" data-region="0.2"></span>
        <span class=".cursor-poiter"  data-region="1.0"></span>
        <span class=".cursor-poiter" data-region="1.1"></span>
        <span class=".cursor-poiter" data-region="1.2"></span>
        <span class=".cursor-poiter" data-region="2.0"></span>
        <span class=".cursor-poiter" data-region="2.1"></span>
        <span class=".cursor-poiter"  data-region="2.2"></span>
    </section>



</body>
</html>
